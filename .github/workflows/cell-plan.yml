name: Cell plan and apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [development, staging, production]
      cell:
        description: Cell identifier
        required: true
        type: string
      operation:
        description: Planned cell state
        required: true
        type: choice
        options: [create, prepare, deploy, converge, destroy]
      apply:
        description: Apply the reviewed saved plan
        required: true
        default: false
        type: boolean
      release_manifest_digest:
        description: Digest of the verified release manifest
        required: true
        type: string
      signature_bundle_digest:
        description: Digest of the release signature bundle
        required: true
        type: string
      revision:
        description: Immutable configuration revision
        required: true
        type: string
      collector_otlp_token_ref:
        description: Exact active Collector OTLP token reference
        required: true
        default: grafana-otlp-token-active
        type: choice
        options: [grafana-otlp-token-active, grafana-otlp-token-standby]
      synthetic_image_digest:
        description: Signed accountable-k6 image digest required only for staging
        required: false
        type: string
      promotion_evidence_key:
        description: Required protected evidence key for staging and production
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: cell-${{ inputs.environment }}-${{ inputs.cell }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_DEFAULT_REGION: eu-west-2
  RELEASE_BUCKET: accountable-releases-453722413624-eu-west-2
  GRAFANA_OTLP_PRIVATE_DNS: ${{ vars.ACCOUNTABLE_GRAFANA_OTLP_PRIVATE_DNS }}
  GRAFANA_OTLP_PRIVATE_LINK_SERVICE_NAME: ${{ vars.ACCOUNTABLE_GRAFANA_OTLP_PRIVATE_LINK_SERVICE_NAME }}

jobs:
  ci:
    uses: ./.github/workflows/require-green-ci.yml
    permissions:
      actions: read
      contents: read

  capacity:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Request branch-trusted capacity identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-capacity-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);
            core.exportVariable("AWS_ROLE_ARN", "arn:aws:iam::453722413624:role/accountable-development-plan");

      - name: Require one fresh passing published capacity sample
        run: bash scripts/observability/check-capacity.sh >"$RUNNER_TEMP/capacity.json"

      - name: Preserve the consumed capacity sample
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity.json
          retention-days: 1

  plan:
    if: github.ref == 'refs/heads/main'
    needs: [ci, capacity]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Resolve the exact environment contract
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CELL: ${{ inputs.cell }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT:$CELL" in
            development:development-01|development:proof-01) account=453722413624 ;;
            staging:staging-01) account=723225039926 ;;
            production:production-01) account=576329195663 ;;
            *) echo "the cell does not belong to the selected environment" >&2; exit 2 ;;
          esac
          desired=0
          collector=1
          if [[ "$ENVIRONMENT" != "development" ]]; then collector=2; fi
          if [[ "$OPERATION" == "deploy" || "$OPERATION" == "converge" ]]; then desired="$collector"; fi
          if [[ "$OPERATION" == "converge" && "${{ inputs.apply }}" == "true" ]]; then
            echo "a convergence proof cannot be applied" >&2
            exit 2
          fi
          echo "AWS_ACCOUNT_ID=$account" >>"$GITHUB_ENV"
          echo "AWS_PLAN_ROLE_ARN=arn:aws:iam::$account:role/accountable-$ENVIRONMENT-plan" >>"$GITHUB_ENV"
          echo "ROOT=infra/opentofu/environments/$ENVIRONMENT/cells/$CELL" >>"$GITHUB_ENV"
          echo "REGISTRY=$account.dkr.ecr.eu-west-2.amazonaws.com" >>"$GITHUB_ENV"
          echo "DESIRED_COUNT=$desired" >>"$GITHUB_ENV"
          echo "COLLECTOR_COUNT=$collector" >>"$GITHUB_ENV"

      - name: Request branch-trusted plan identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-plan-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);
            core.exportVariable("AWS_ROLE_ARN", process.env.AWS_PLAN_ROLE_ARN);

      - name: Verify the signed release and replicated OCI signatures
        env:
          MANIFEST_DIGEST: ${{ inputs.release_manifest_digest }}
          BUNDLE_DIGEST: ${{ inputs.signature_bundle_digest }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          API_IMAGE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image-build.yml@refs/heads/main
          COLLECTOR_IMAGE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/collector-image.yml@refs/heads/main
          SYNTHETIC_IMAGE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/k6-image.yml@refs/heads/main
          SYNTHETIC_IMAGE_DIGEST: ${{ inputs.synthetic_image_digest }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          mise trust mise.toml
          aws s3api get-object --bucket "$RELEASE_BUCKET" --key "releases/v1/manifests/$MANIFEST_DIGEST.json" "$RUNNER_TEMP/release.json" >/dev/null
          api_digest="$(jq -er '.artifacts[] | select(.name == "api_oci") | .digest' "$RUNNER_TEMP/release.json")"
          collector_digest="$(jq -er '.artifacts[] | select(.name == "collector_oci") | .digest' "$RUNNER_TEMP/release.json")"
          export IMAGE_URI="$REGISTRY/accountable@$api_digest"
          export COLLECTOR_IMAGE_URI="$REGISTRY/accountable-collector@$collector_digest"
          synthetic_image_uri=""
          if [[ "$TARGET_ENVIRONMENT" == "staging" ]]; then
            if [[ ! "$SYNTHETIC_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "staging requires a signed synthetic workload image digest" >&2
              exit 2
            fi
            synthetic_image_uri="$REGISTRY/accountable-k6@$SYNTHETIC_IMAGE_DIGEST"
          elif [[ -n "$SYNTHETIC_IMAGE_DIGEST" ]]; then
            echo "the synthetic workload image is accepted only for staging" >&2
            exit 2
          fi
          verified=""
          for attempt in $(seq 1 30); do
            if verified="$(mise exec -- bash scripts/release/verify-deployment.sh 2>/dev/null)"; then
              if [[ -z "$synthetic_image_uri" ]] || mise exec -- cosign verify \
                --certificate-identity "$SYNTHETIC_IMAGE_IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$synthetic_image_uri" >/dev/null 2>&1; then
                break
              fi
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "the signed OCI artifacts and signatures did not replicate within 10 minutes" >&2
              exit 1
            fi
            sleep 20
          done
          release_id="$(jq -er .release_id <<<"$verified")"
          web_digest="$(jq -er .web_asset_digest <<<"$verified")"
          jq -n --arg release_id "$release_id" --arg web_digest "$web_digest" --arg image "$IMAGE_URI" --arg collector "$COLLECTOR_IMAGE_URI" \
            --arg synthetic "$synthetic_image_uri" \
            '{release_id:$release_id,web_asset_digest:$web_digest,image_uri:$image,collector_image_uri:$collector,synthetic_image_uri:(if $synthetic == "" then null else $synthetic end)}' \
            >"$RUNNER_TEMP/deployment.json"

      - name: Verify required promotion evidence
        if: inputs.environment != 'development'
        env:
          EVIDENCE_KEY: ${{ inputs.promotion_evidence_key }}
          MANIFEST_DIGEST: ${{ inputs.release_manifest_digest }}
          BUNDLE_DIGEST: ${{ inputs.signature_bundle_digest }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ ! "$EVIDENCE_KEY" =~ ^observability/v1/promotion-evidence/ ]]; then
            echo "a protected promotion-evidence key is required" >&2
            exit 2
          fi
          aws s3api get-object --bucket "$RELEASE_BUCKET" --key "$EVIDENCE_KEY" "$RUNNER_TEMP/promotion.json" >/dev/null
          actual_key="$(mise exec -- go run ./cmd/observability-gate promotion-key <"$RUNNER_TEMP/promotion.json")"
          [[ "$actual_key" == "$EVIDENCE_KEY" ]]
          jq -e --arg target "$TARGET_ENVIRONMENT" --arg manifest "$MANIFEST_DIGEST" --arg bundle "$BUNDLE_DIGEST" \
            '.decision == "pass" and .target_environment == $target and .release_manifest_digest == $manifest and .signature_bundle_digest == $bundle' \
            "$RUNNER_TEMP/promotion.json" >/dev/null
          jq -e -s '.[0].artifacts == .[1].artifacts' "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/promotion.json" >/dev/null

      - name: Create and evaluate the saved plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          MANIFEST_DIGEST: ${{ inputs.release_manifest_digest }}
          REVISION: ${{ inputs.revision }}
          RUNBOOK_BASE_URL: ${{ vars.ACCOUNTABLE_RUNBOOK_BASE_URL }}
          DASHBOARD_BASE_URL: ${{ vars.ACCOUNTABLE_GRAFANA_STACK_URL }}
        run: |
          set -euo pipefail
          release_id="$(jq -er .release_id "$RUNNER_TEMP/deployment.json")"
          web_digest="$(jq -er .web_asset_digest "$RUNNER_TEMP/deployment.json")"
          image_uri="$(jq -er .image_uri "$RUNNER_TEMP/deployment.json")"
          collector_image_uri="$(jq -er .collector_image_uri "$RUNNER_TEMP/deployment.json")"
          synthetic_argument=()
          if [[ "$ENVIRONMENT" == "staging" ]]; then
            synthetic_image_uri="$(jq -er .synthetic_image_uri "$RUNNER_TEMP/deployment.json")"
            synthetic_argument=(-var="synthetic_image_uri=$synthetic_image_uri")
          fi
          mise exec -- tofu -chdir="$ROOT" init -input=false
          if [[ "$OPERATION" == "create" && -n "$(mise exec -- tofu -chdir="$ROOT" state list)" ]]; then
            echo "create requires an empty cell state" >&2
            exit 1
          fi
          previous_argument=()
          if current="$(mise exec -- tofu -chdir="$ROOT" output -json web_identity 2>/dev/null)"; then
            if ! jq -e --arg release "$release_id" --arg digest "$web_digest" --arg revision "$REVISION" \
              '.release_id == $release and .web_asset_digest == $digest and .configuration_revision == $revision' <<<"$current" >/dev/null; then
              previous_argument=(-var="previous_web_identity=$current")
            fi
          fi
          lifecycle_argument=()
          if [[ "$ENVIRONMENT" != "development" ]]; then
            snapshot="accountable-${{ inputs.cell }}-${release_id//-/}"
            lifecycle_argument=(-var="database_final_snapshot_identifier=${snapshot:0:63}")
          fi
          destroy_argument=()
          if [[ "$OPERATION" == "destroy" ]]; then destroy_argument=(-destroy); fi
          set +e
          mise exec -- tofu -chdir="$ROOT" plan \
            -input=false -detailed-exitcode -out="$RUNNER_TEMP/cell.plan" \
            "${destroy_argument[@]}" "${previous_argument[@]}" "${lifecycle_argument[@]}" "${synthetic_argument[@]}" \
            -var="api_desired_count=$DESIRED_COUNT" \
            -var="collector_desired_count=$COLLECTOR_COUNT" \
            -var="configuration_revision=$REVISION" \
            -var="image_uri=$image_uri" \
            -var="collector_image_uri=$collector_image_uri" \
            -var="collector_otlp_token_ref=${{ inputs.collector_otlp_token_ref }}" \
            -var="grafana_otlp_private_dns=$GRAFANA_OTLP_PRIVATE_DNS" \
            -var="grafana_otlp_private_link_service_name=$GRAFANA_OTLP_PRIVATE_LINK_SERVICE_NAME" \
            -var="release_id=$release_id" \
            -var="release_manifest_digest=$MANIFEST_DIGEST" \
            -var="web_asset_digest=$web_digest" \
            -var="runbook_base_url=$RUNBOOK_BASE_URL" \
            -var="dashboard_base_url=$DASHBOARD_BASE_URL"
          plan_status=$?
          set -e
          if [[ "$plan_status" == 1 ]]; then exit 1; fi
          if [[ "$OPERATION" == "converge" && "$plan_status" != 0 ]]; then
            echo "the cell has OpenTofu drift" >&2
            exit 1
          fi
          mise exec -- tofu -chdir="$ROOT" show -json "$RUNNER_TEMP/cell.plan" >"$RUNNER_TEMP/cell-plan.json"
          mise exec -- tofu -chdir="$ROOT" show -no-color "$RUNNER_TEMP/cell.plan" >"$RUNNER_TEMP/cell-plan.txt"
          mise exec -- go run ./cmd/tofupolicy --account-id "$AWS_ACCOUNT_ID" --plan "$RUNNER_TEMP/cell-plan.json"

      - name: Download consumed capacity sample
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Upload reviewed plan and bound evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cell-${{ inputs.environment }}-${{ inputs.cell }}-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cell.plan
            ${{ runner.temp }}/cell-plan.json
            ${{ runner.temp }}/cell-plan.txt
            ${{ runner.temp }}/capacity.json
            ${{ runner.temp }}/deployment.json
            ${{ runner.temp }}/release.json
            ${{ runner.temp }}/promotion.json
          if-no-files-found: error
          retention-days: 1

  apply:
    if: inputs.apply
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Download reviewed plan and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cell-${{ inputs.environment }}-${{ inputs.cell }}-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cell-plan

      - name: Reject stale capacity evidence
        run: |
          set -euo pipefail
          source scripts/observability/lib/evidence.sh
          jq -e '.state == "pass"' "$RUNNER_TEMP/cell-plan/capacity.json" >/dev/null
          observed="$(jq -er .observed_at "$RUNNER_TEMP/cell-plan/capacity.json")"
          age="$(accountable_evidence_age_seconds "$observed")"
          if (( age < 0 || age > 1800 )); then
            echo "the reviewed capacity sample is stale; run a new plan" >&2
            exit 1
          fi
          if [[ "${{ inputs.environment }}" != "development" ]]; then
            evidence="$RUNNER_TEMP/cell-plan/promotion.json"
            jq -e --arg target "${{ inputs.environment }}" '.decision == "pass" and .target_environment == $target' "$evidence" >/dev/null
            evaluated_at="$(jq -er .evaluated_at "$evidence")"
            evidence_age="$(accountable_evidence_age_seconds "$evaluated_at")"
            if (( evidence_age < 0 || evidence_age > 1800 )); then
              echo "the reviewed promotion evidence is stale; evaluate and plan again" >&2
              exit 1
            fi
            mise trust mise.toml
            mise exec -- go run ./cmd/observability-gate promotion-key <"$evidence" >/dev/null
          fi

      - name: Resolve protected apply identity
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            development) account=453722413624 ;;
            staging) account=723225039926 ;;
            production) account=576329195663 ;;
          esac
          echo "AWS_ACCOUNT_ID=$account" >>"$GITHUB_ENV"
          echo "AWS_APPLY_ROLE_ARN=arn:aws:iam::$account:role/accountable-$ENVIRONMENT-apply" >>"$GITHUB_ENV"
          echo "ROOT=infra/opentofu/environments/$ENVIRONMENT/cells/${{ inputs.cell }}" >>"$GITHUB_ENV"

      - name: Request protected apply identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-apply-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);
            core.exportVariable("AWS_ROLE_ARN", process.env.AWS_APPLY_ROLE_ARN);

      - name: Apply only the reviewed plan
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          mise trust mise.toml
          mise exec -- tofu -chdir="$ROOT" init -input=false
          mise exec -- go run ./cmd/tofupolicy --account-id "$AWS_ACCOUNT_ID" --plan "$RUNNER_TEMP/cell-plan/cell-plan.json"
          mise exec -- tofu -chdir="$ROOT" apply -input=false "$RUNNER_TEMP/cell-plan/cell.plan"
          if [[ "$OPERATION" == "destroy" && -n "$(mise exec -- tofu -chdir="$ROOT" state list)" ]]; then
            echo "cell state is not empty after destroy" >&2
            exit 1
          fi
