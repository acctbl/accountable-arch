name: Environment foundation plan and apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [development, staging, production]
      apply:
        description: Apply the reviewed saved plan
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: foundation-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_DEFAULT_REGION: eu-west-2

jobs:
  ci:
    uses: ./.github/workflows/require-green-ci.yml
    permissions:
      actions: read
      contents: read

  plan:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Resolve the branch-trusted plan identity
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            development) account=453722413624 ;;
            staging) account=723225039926 ;;
            production) account=576329195663 ;;
          esac
          echo "AWS_ROLE_ARN=arn:aws:iam::$account:role/accountable-$ENVIRONMENT-plan" >>"$GITHUB_ENV"
          echo "ROOT=infra/opentofu/environments/$ENVIRONMENT/foundation" >>"$GITHUB_ENV"

      - name: Request branch-trusted plan identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-foundation-plan-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);

      - name: Create the saved foundation plan
        run: |
          set -euo pipefail
          mise trust mise.toml
          mise exec -- tofu -chdir="$ROOT" init -input=false -lockfile=readonly
          mise exec -- tofu -chdir="$ROOT" plan \
            -input=false \
            -lock-timeout=5m \
            -out="$RUNNER_TEMP/foundation.plan"
          mise exec -- tofu -chdir="$ROOT" show -no-color "$RUNNER_TEMP/foundation.plan" >"$RUNNER_TEMP/foundation.txt"
          (
            cd "$RUNNER_TEMP"
            sha256sum foundation.plan >foundation.plan.sha256
          )
          {
            echo '```hcl'
            sed -n '1,500p' "$RUNNER_TEMP/foundation.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve the exact reviewed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-plan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/foundation.plan
            ${{ runner.temp }}/foundation.plan.sha256
            ${{ runner.temp }}/foundation.txt
          retention-days: 7

  apply:
    if: inputs.apply && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Resolve the protected foundation identity
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            development) account=453722413624 ;;
            staging) account=723225039926 ;;
            production) account=576329195663 ;;
          esac
          echo "AWS_ROLE_ARN=arn:aws:iam::$account:role/accountable-$ENVIRONMENT-foundation-apply" >>"$GITHUB_ENV"
          echo "ROOT=infra/opentofu/environments/$ENVIRONMENT/foundation" >>"$GITHUB_ENV"

      - name: Request protected foundation identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-foundation-apply-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);

      - name: Download the reviewed plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: foundation-plan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-plan

      - name: Apply only the reviewed plan
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/foundation-plan"
          sha256sum --check foundation.plan.sha256
          cd "$GITHUB_WORKSPACE"
          mise trust mise.toml
          mise exec -- tofu -chdir="$ROOT" init -input=false -lockfile=readonly
          mise exec -- tofu -chdir="$ROOT" apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            "$RUNNER_TEMP/foundation-plan/foundation.plan"
          mise exec -- tofu -chdir="$ROOT" output -json >"$RUNNER_TEMP/foundation-output.json"
          jq 'with_entries(select(.value.sensitive | not))' "$RUNNER_TEMP/foundation-output.json" >>"$GITHUB_STEP_SUMMARY"
