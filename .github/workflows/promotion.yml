name: Promotion evidence

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment that will receive the exact signed release
        required: true
        type: choice
        options: [staging, production]
      source_cell:
        description: Active source cell evaluated for promotion
        required: true
        type: string
      release_manifest_digest:
        description: Digest of the signed release manifest
        required: true
        type: string
      signature_bundle_digest:
        description: Digest of the release signature bundle
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: promotion-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_DEFAULT_REGION: eu-west-2
  RELEASE_BUCKET: accountable-releases-453722413624-eu-west-2

jobs:
  ci:
    uses: ./.github/workflows/require-green-ci.yml
    permissions:
      actions: read
      contents: read

  capacity:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Request branch-trusted capacity identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-promotion-capacity-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);
            core.exportVariable("AWS_ROLE_ARN", "arn:aws:iam::453722413624:role/accountable-development-plan");

      - name: Read one published capacity sample
        run: |
          set -euo pipefail
          if ! bash scripts/observability/check-capacity.sh >"$RUNNER_TEMP/capacity.json" || \
             ! jq -e '.state == "pass" or .state == "fail" or .state == "unknown"' "$RUNNER_TEMP/capacity.json" >/dev/null; then
            jq -n --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{state:"unknown",observed_at:$observed_at}' >"$RUNNER_TEMP/capacity.json"
          fi

      - name: Preserve the exact capacity input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity.json
          retention-days: 1

  evaluate:
    if: github.ref == 'refs/heads/main'
    needs: [ci, capacity]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.target_environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      SOURCE_CELL: ${{ inputs.source_cell }}
      MANIFEST_DIGEST: ${{ inputs.release_manifest_digest }}
      BUNDLE_DIGEST: ${{ inputs.signature_bundle_digest }}
      RELEASE_KMS_KEY_ID: ${{ vars.ACCOUNTABLE_RELEASE_KMS_KEY_ARN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Download the consumed capacity sample
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Resolve the exact promotion path
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT:$SOURCE_CELL" in
            staging:development-01|staging:proof-01)
              source_environment=development
              account=453722413624
              cells=development-01,proof-01
              ;;
            production:staging-01)
              source_environment=staging
              account=723225039926
              cells=staging-01
              ;;
            *)
              echo "the source cell does not belong to the required promotion path" >&2
              exit 2
              ;;
          esac
          echo "SOURCE_ENVIRONMENT=$source_environment" >>"$GITHUB_ENV"
          echo "SOURCE_CELLS=$cells" >>"$GITHUB_ENV"
          echo "SOURCE_ACCOUNT=$account" >>"$GITHUB_ENV"
          echo "ROOT=infra/opentofu/environments/$source_environment/cells/$SOURCE_CELL" >>"$GITHUB_ENV"
          echo "AWS_ROLE_ARN=arn:aws:iam::$account:role/accountable-$source_environment-apply" >>"$GITHUB_ENV"
          echo "REGISTRY=$account.dkr.ecr.eu-west-2.amazonaws.com" >>"$GITHUB_ENV"

      - name: Request protected source identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-promotion-source-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);

      - name: Verify the exact signed release and source deployment
        env:
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          API_IMAGE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image-build.yml@refs/heads/main
          COLLECTOR_IMAGE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/collector-image.yml@refs/heads/main
        run: |
          set -euo pipefail
          mise trust mise.toml
          aws s3api get-object --bucket "$RELEASE_BUCKET" --key "releases/v1/manifests/$MANIFEST_DIGEST.json" "$RUNNER_TEMP/release.json" >/dev/null
          api_digest="$(jq -er '.artifacts[] | select(.name == "api_oci") | .digest' "$RUNNER_TEMP/release.json")"
          collector_digest="$(jq -er '.artifacts[] | select(.name == "collector_oci") | .digest' "$RUNNER_TEMP/release.json")"
          export IMAGE_URI="$REGISTRY/accountable@$api_digest"
          export COLLECTOR_IMAGE_URI="$REGISTRY/accountable-collector@$collector_digest"
          mise exec -- bash scripts/release/verify-deployment.sh >"$RUNNER_TEMP/verified-release.json"
          mise exec -- tofu -chdir="$ROOT" init -input=false
          mise exec -- tofu -chdir="$ROOT" output -json >"$RUNNER_TEMP/cell-output.json"
          release_id="$(jq -er .release_id "$RUNNER_TEMP/release.json")"
          jq -e --arg release "$release_id" '.web_identity.value.release_id == $release' "$RUNNER_TEMP/cell-output.json" >/dev/null
          echo "RELEASE_ID=$release_id" >>"$GITHUB_ENV"

      - name: Evaluate every promotion source
        run: |
          set -euo pipefail
          collection_epoch="$(date -u +%s)"
          collection_at="$(date -u -d "@$collection_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          budget_end_epoch="$((collection_epoch / 300 * 300 - 600))"
          budget_end="$(date -u -d "@$budget_end_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          budget_start="$(date -u -d "@$((budget_end_epoch - 2592000))" +%Y-%m-%dT%H:%M:%SZ)"
          loss_start="$(date -u -d "@$((collection_epoch - 604800))" +%Y-%m-%dT%H:%M:%SZ)"
          instant_start="$(date -u -d "@$((collection_epoch - 1800))" +%Y-%m-%dT%H:%M:%SZ)"
          observation_end="$(date -u +%Y-%m-%dT00:00:00Z)"
          observation_start="$(date -u -d "$observation_end -7 days" +%Y-%m-%dT%H:%M:%SZ)"

          run_gate() {
            output="$1"
            shift
            set +e
            "$@" >"$output"
            status=$?
            set -e
            if (( status != 0 )) && ! jq -e . "$output" >/dev/null 2>&1; then
              jq -n --arg observed_at "$collection_at" '{state:"unknown",observed_at:$observed_at}' >"$output"
            fi
          }

          ACCOUNTABLE_ENVIRONMENT="$SOURCE_ENVIRONMENT" \
            ACCOUNTABLE_CELLS="$SOURCE_CELLS" \
            ACCOUNTABLE_RELEASE_BUCKET="$RELEASE_BUCKET" \
            ACCOUNTABLE_WINDOW_START="$budget_start" \
            ACCOUNTABLE_WINDOW_END="$budget_end" \
            run_gate "$RUNNER_TEMP/budget.json" bash scripts/observability/collect-budget.sh

          if [[ "$TARGET_ENVIRONMENT" == "production" ]]; then
            ACCOUNTABLE_ENVIRONMENT="$SOURCE_ENVIRONMENT" \
              ACCOUNTABLE_CELLS="$SOURCE_CELLS" \
              ACCOUNTABLE_RELEASE_BUCKET="$RELEASE_BUCKET" \
              ACCOUNTABLE_WINDOW_START="$observation_start" \
              ACCOUNTABLE_WINDOW_END="$observation_end" \
              ACCOUNTABLE_BUDGET_EVALUATOR=staging-observation-snapshot \
              run_gate "$RUNNER_TEMP/staging-observation.json" bash scripts/observability/collect-budget.sh
          else
            jq -n --arg observed_at "$collection_at" '{state:"unknown",observed_at:$observed_at}' >"$RUNNER_TEMP/staging-observation.json"
          fi

          cluster="$(jq -er .ecs_cluster_arn.value "$RUNNER_TEMP/cell-output.json")"
          collector="$(jq -er .collector_service_name.value "$RUNNER_TEMP/cell-output.json")"
          ACCOUNTABLE_ENVIRONMENT="$SOURCE_ENVIRONMENT" \
            ACCOUNTABLE_CELL="$SOURCE_CELL" \
            ACCOUNTABLE_CLUSTER="$cluster" \
            ACCOUNTABLE_COLLECTOR_SERVICE="$collector" \
            ACCOUNTABLE_WINDOW_START="$loss_start" \
            ACCOUNTABLE_WINDOW_END="$collection_at" \
            run_gate "$RUNNER_TEMP/loss.json" bash scripts/observability/collect-loss.sh

          ACCOUNTABLE_ENVIRONMENT="$SOURCE_ENVIRONMENT" run_gate "$RUNNER_TEMP/critical-alarms.json" bash scripts/observability/check-alarms.sh
          ACCOUNTABLE_ENVIRONMENT="$SOURCE_ENVIRONMENT" run_gate "$RUNNER_TEMP/infrastructure.json" bash -c 'scripts/observability/check-infrastructure.sh <"$1"' _ "$RUNNER_TEMP/cell-output.json"
          for gate in proof privacy paging; do
            ACCOUNTABLE_ENVIRONMENT="$SOURCE_ENVIRONMENT" \
              ACCOUNTABLE_CELL="$SOURCE_CELL" \
              ACCOUNTABLE_RELEASE_ID="$RELEASE_ID" \
              ACCOUNTABLE_GATE="$gate" \
              run_gate "$RUNNER_TEMP/$gate.json" bash scripts/observability/check-proof.sh
          done

          evaluated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          budget_state="$(jq -r 'if .state == "complete" and .availability_remaining_basis_points > 0 and .latency_remaining_basis_points > 0 then "pass" elif .state == "complete" then "fail" else "unknown" end' "$RUNNER_TEMP/budget.json")"
          jq -n \
            --arg source "$SOURCE_ENVIRONMENT" \
            --arg target "$TARGET_ENVIRONMENT" \
            --arg evaluated "$evaluated_at" \
            --arg run_id "${{ github.run_id }}" \
            --arg workflow "https://github.com/${{ github.repository }}/.github/workflows/promotion.yml@refs/heads/main" \
            --arg release "$RELEASE_ID" \
            --arg manifest "$MANIFEST_DIGEST" \
            --arg bundle "$BUNDLE_DIGEST" \
            --arg budget_state "$budget_state" \
            --arg budget_start "$budget_start" \
            --arg budget_end "$budget_end" \
            --arg loss_start "$loss_start" \
            --arg loss_end "$collection_at" \
            --arg instant_start "$instant_start" \
            --arg observation_start "$observation_start" \
            --arg observation_end "$observation_end" \
            --slurpfile release_document "$RUNNER_TEMP/release.json" \
            --slurpfile capacity "$RUNNER_TEMP/capacity.json" \
            --slurpfile alarms "$RUNNER_TEMP/critical-alarms.json" \
            --slurpfile infrastructure "$RUNNER_TEMP/infrastructure.json" \
            --slurpfile loss "$RUNNER_TEMP/loss.json" \
            --slurpfile paging "$RUNNER_TEMP/paging.json" \
            --slurpfile privacy "$RUNNER_TEMP/privacy.json" \
            --slurpfile proof "$RUNNER_TEMP/proof.json" \
            --slurpfile staging_observation "$RUNNER_TEMP/staging-observation.json" '
              def observed($source): ($source[0].observed_at // $evaluated);
              {
                source_environment:$source,
                target_environment:$target,
                evaluated_at:$evaluated,
                workflow_run_id:$run_id,
                workflow_identity:$workflow,
                release_id:$release,
                release_manifest_digest:$manifest,
                signature_bundle_digest:$bundle,
                artifacts:$release_document[0].artifacts,
                gates:([
                  {name:"budget",state:$budget_state,observed_at:$budget_end,window_start:$budget_start,window_end:$budget_end},
                  {name:"capacity",state:$capacity[0].state,observed_at:observed($capacity),window_start:$instant_start,window_end:$evaluated},
                  {name:"critical_alarms",state:$alarms[0].state,observed_at:observed($alarms),window_start:$instant_start,window_end:$evaluated},
                  {name:"infrastructure",state:$infrastructure[0].state,observed_at:observed($infrastructure),window_start:$instant_start,window_end:$evaluated},
                  {name:"loss",state:$loss[0].state,observed_at:$loss_end,window_start:$loss_start,window_end:$loss_end},
                  {name:"paging",state:$paging[0].state,observed_at:observed($paging),window_start:$instant_start,window_end:$evaluated},
                  {name:"privacy",state:$privacy[0].state,observed_at:observed($privacy),window_start:$instant_start,window_end:$evaluated},
                  {name:"proof",state:$proof[0].state,observed_at:observed($proof),window_start:$instant_start,window_end:$evaluated}
                ] + (if $target == "production" then [{name:"staging_observation",state:$staging_observation[0].state,observed_at:$observation_end,window_start:$observation_start,window_end:$observation_end}] else [] end))
              }
            ' | mise exec -- go run ./cmd/observability-gate promotion >"$RUNNER_TEMP/promotion.json"
          key="$(mise exec -- go run ./cmd/observability-gate promotion-key <"$RUNNER_TEMP/promotion.json")"
          aws s3api put-object \
            --bucket "$RELEASE_BUCKET" \
            --key "$key" \
            --body "$RUNNER_TEMP/promotion.json" \
            --content-type application/json \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$RELEASE_KMS_KEY_ID" \
            --if-none-match '*' >/dev/null
          lock="$(aws s3api head-object --bucket "$RELEASE_BUCKET" --key "$key" --query '[ObjectLockMode,ObjectLockRetainUntilDate]' --output json)"
          jq -e '.[0] == "COMPLIANCE" and (.[1] | type == "string" and length > 0)' <<<"$lock" >/dev/null
          retained_until="$(jq -er '.[1]' <<<"$lock")"
          minimum_retention="$(date -u -d "$evaluated_at +7 years -1 day" +%s)"
          if (( $(date -u -d "$retained_until" +%s) < minimum_retention )); then
            echo "promotion evidence does not have seven-year compliance retention" >&2
            exit 1
          fi
          echo "EVIDENCE_KEY=$key" >>"$GITHUB_ENV"

      - name: Preserve canonical promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-${{ inputs.target_environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion.json
          if-no-files-found: error
          retention-days: 7

      - name: Require a passing decision
        run: |
          set -euo pipefail
          jq -e '.decision == "pass"' "$RUNNER_TEMP/promotion.json" >/dev/null
          echo "Promotion evidence: `$EVIDENCE_KEY`" >>"$GITHUB_STEP_SUMMARY"
