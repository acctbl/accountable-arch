name: Protected evidence retention

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type retain-evidence-for-seven-years
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: protected-evidence-retention
  cancel-in-progress: false

jobs:
  retain:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'retain-evidence-for-seven-years'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: development
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ROLE_ARN: arn:aws:iam::453722413624:role/accountable-development-apply
      RELEASE_BUCKET: accountable-releases-453722413624-eu-west-2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Request protected AWS identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-retention-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);

      - name: Apply seven-year compliance retention to every protected version
        run: bash scripts/release/backfill-object-lock.sh
