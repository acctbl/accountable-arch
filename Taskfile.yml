# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: Run CI locally
    cmds:
      - task: ci

  setup:
    desc: Install the exact tools and JavaScript packages for this repository
    cmds:
      - git config --local core.hooksPath .githooks
      - mise install --locked
      - pnpm install --frozen-lockfile
      - |
        if [ -n "${CI:-}" ] && [ -z "${PLAYWRIGHT_OS_DEPS_INSTALLED:-}" ]; then
          pnpm exec playwright install --with-deps chromium firefox webkit
        else
          pnpm exec playwright install chromium firefox webkit
        fi

  api:dev:
    desc: Start disposable Docker Postgres, migrate, preflight, and serve the API
    cmds:
      - bash scripts/with-test-postgres.sh bash scripts/api-dev.sh

  generate:
    desc: Regenerate versioned code
    cmds:
      - node scripts/generate-telemetry-contract.mjs
      - >-
        pnpm --filter @accountable/client-telemetry exec biome format --write
        src/generated
      - buf generate
      - pnpm --filter @accountable/web generate-routes

  format:
    desc: Apply Go and Biome formatting
    cmds:
      - gofmt -w cmd internal scripts/opentofu/aws-account-mock
      - goimports -w cmd internal scripts/opentofu/aws-account-mock
      - pnpm format

  format:check:
    desc: Check formatting (Go + Biome)
    cmds:
      - |
        unformatted="$(gofmt -l cmd internal scripts/opentofu/aws-account-mock)"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
      - |
        unformatted="$(goimports -l cmd internal scripts/opentofu/aws-account-mock)"
        if [ -n "$unformatted" ]; then
          echo "goimports needed on:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
      - pnpm format:check

  lint:
    desc: Lint Buf, Go, JavaScript/TypeScript, and GitHub workflows
    cmds:
      - bash scripts/check-workflows.sh
      - bash scripts/observability/check-proof-workflow.sh
      - bash scripts/observability/check-runbooks.sh
      - bash scripts/observability/test-check-alarms.sh
      - bash scripts/observability/test-check-capacity.sh
      - bash scripts/observability/test-configure-irm-route.sh
      - bash scripts/observability/test-prove-paging.sh
      - bash -n scripts/aws/configure-github-oidc.sh scripts/observability/lib/evidence.sh scripts/observability/configure-irm-route.sh scripts/observability/prove-paging.sh scripts/observability/prove-task-uncertainty.sh scripts/observability/test-check-alarms.sh scripts/observability/test-check-capacity.sh scripts/observability/test-configure-irm-route.sh scripts/observability/test-prove-paging.sh
      - bash scripts/release/test-backfill-object-lock.sh
      - buf lint
      - golangci-lint run ./cmd/... ./internal/... ./scripts/opentofu/aws-account-mock/...
      - pnpm lint

  gen:fresh:
    desc: Fail if regenerating would change generated output
    cmds:
      - |
        set -euo pipefail
        paths=(
          gen
          packages/proto/src
          apps/web/src/routeTree.gen.ts
          internal/platform/telemetry/client_contract_generated.go
          packages/client-telemetry/src/generated/client-contract.schema.ts
        )
        snapshot="$(mktemp -d "${TMPDIR:-/tmp}/accountable-gen-fresh.XXXXXX")"
        cleanup() { rm -rf "$snapshot"; }
        trap cleanup EXIT

        for path in "${paths[@]}"; do
          if [ -e "$path" ]; then
            mkdir -p "$snapshot/$(dirname "$path")"
            cp -a "$path" "$snapshot/$path"
          fi
        done

        task generate

        status=0
        : >"$snapshot/diff"
        for path in "${paths[@]}"; do
          if [ -e "$snapshot/$path" ] || [ -e "$path" ]; then
            if ! diff -ru "$snapshot/$path" "$path" >>"$snapshot/diff" 2>&1; then
              status=1
            fi
          fi
        done

        if [ "$status" -ne 0 ]; then
          echo "generated output was stale; regenerate and commit the result:" >&2
          cat "$snapshot/diff" >&2
          exit 1
        fi

  compile:
    desc: Compile Go and TypeScript
    cmds:
      - go build ./...
      - pnpm typecheck

  test:unit:
    desc: Run unit tests with the Go race detector
    cmds:
      - go test -race ./... -skip Integration
      - pnpm -r --if-present test:unit

  collector:validate:
    desc: Build the pinned Collector distribution and validate the generated cell configuration
    cmds:
      - bash scripts/collector/validate-config.sh

  test:component:
    desc: Run component tests
    cmds:
      - pnpm -r --if-present test:component

  test:integration:
    desc: Run integration tests in every Go package and Playwright
    cmds:
      - task: test:postgres
      - go test -race ./... -run Integration
      - pnpm exec playwright test tests/integration

  test:postgres:
    desc: Prove bootstrap and migration refusals against real Postgres
    cmds:
      - >-
        bash scripts/with-test-postgres.sh go test -race
        ./cmd/bootstrap ./internal/migration ./tests/foundation -run PostgresIntegration -count=1

  test:managed-contract:
    desc: Prove the S3, KMS, and Parameter Store adapters against managed development services
    cmds:
      - >-
        ACCOUNTABLE_REQUIRE_MANAGED_CONTRACT=1 go test -race -v
        ./internal/platform/storage ./internal/platform/crypto ./internal/platform/secret
        -run AWSContract -count=1 -timeout=90s

  prove:observability:
    desc: Prove the live observability posture of a cell and its environment
    requires:
      vars: [ACCOUNTABLE_CELL, ACCOUNTABLE_RELEASE_BUCKET]
    cmds:
      - bash scripts/aws/prove-observability-posture.sh

  test:cell-edge:
    desc: Prove browser and Connect behavior through a deployed CloudFront cell edge
    requires:
      vars: [ACCOUNTABLE_CELL_URL, ACCOUNTABLE_EXPECTED_RELEASE_ID]
    cmds:
      - pnpm exec playwright test --config playwright.cell.config.ts

  test:production-smoke:
    desc: Prove production-safe web, route, and API identity without failure injection
    requires:
      vars: [ACCOUNTABLE_CELL_URL, ACCOUNTABLE_EXPECTED_RELEASE_ID]
    cmds:
      - pnpm exec playwright test --config playwright.production.config.ts

  test:fuzz:
    desc: Run fuzz targets against the committed seed corpus only
    cmds:
      - go test -race ./... -run '^Fuzz' -count=1

  migrations:check:
    desc: Validate goose migrations
    cmds:
      - go test ./internal/migration -run TestCommittedCatalogueMatchesFilenameContract -count=1
      - goose -dir internal/platform/database/migrations validate

  tofu:
    desc: Format-check, validate, and test every OpenTofu root and module
    cmds:
      - tofu fmt -check -recursive infra/opentofu
      - bash scripts/opentofu/check.sh
      - bash scripts/opentofu/prove-cell-negatives.sh

  i18n:
    desc: Check localisation catalogs are extracted, valid, and complete
    cmds:
      - pnpm --filter @accountable/web i18n:check

  a11y:
    desc: Run accessibility checks
    cmds:
      - pnpm exec playwright test tests/a11y/web.spec.ts

  precommit:
    desc: Fast mechanical gates for the pre-commit hook
    cmds:
      - task: format:check
      - task: lint
      - task: gen:fresh

  prepush:
    desc: Build and lightweight test gates for the pre-push hook
    cmds:
      - task: compile
      - task: test:unit
      - task: test:component
      - task: i18n

  check:
    desc: Full mechanical gate set
    cmds:
      - task: precommit
      - task: prepush
      - task: test:integration
      - task: test:fuzz
      - task: migrations:check
      - task: tofu
      - task: a11y

  prove:negatives:
    desc: Prove each deliberate failure fails the expected gate
    cmds:
      - bash scripts/prove-negatives.sh

  security:exceptions:
    desc: Validate dated exceptions and regenerate scanner allowlists
    cmds:
      - node scripts/security/exceptions-to-allowlists.mjs

  security:gitleaks:
    desc: Scan the tree for committed secrets
    cmds:
      - bash scripts/security/gitleaks.sh

  security:govulncheck:
    desc: Fail on known Go module vulnerabilities
    cmds:
      - bash scripts/security/govulncheck.sh

  security:trivy:
    desc: Scan dependencies and OpenTofu for HIGH/CRITICAL issues
    cmds:
      - bash scripts/security/trivy.sh

  security:lockfile:
    desc: Require committed lockfiles and reject floating :latest tags
    cmds:
      - bash scripts/security/check-lockfiles.sh

  security:sbom:
    desc: Produce a CycloneDX SBOM under dist/
    cmds:
      - bash scripts/security/sbom.sh

  security:
    desc: Full security and supply-chain gate set
    cmds:
      - task: security:exceptions
      - task: security:gitleaks
      - task: security:govulncheck
      - task: security:trivy
      - task: security:lockfile
      - task: security:sbom

  prove:security:
    desc: Prove each security gate fails on a seeded finding
    cmds:
      - bash scripts/security/prove-negatives.sh

  ci:
    desc: Set up and check the repository
    deps: [setup]
    cmds:
      - task: check
      - task: prove:negatives

  ci:security:
    desc: Install tools and run security gates with negative proofs
    cmds:
      - mise install --locked
      - pnpm install --frozen-lockfile --ignore-scripts
      - task: security
      - task: prove:security

  container:parity:
    desc: Build the dev container and run the normal CI Task command inside it
    cmds:
      - |
        docker build \
          --build-arg USER_UID="$(id -u)" \
          --build-arg USER_GID="$(id -g)" \
          --file .devcontainer/Dockerfile \
          --tag accountable-devcontainer:local \
          .
      - |
        docker run --rm \
          --user root \
          --volume accountable-devcontainer-node-modules:/workspaces/accountable/node_modules \
          --volume accountable-devcontainer-admin-node-modules:/workspaces/accountable/apps/admin/node_modules \
          --volume accountable-devcontainer-web-node-modules:/workspaces/accountable/apps/web/node_modules \
          --volume accountable-devcontainer-proto-node-modules:/workspaces/accountable/packages/proto/node_modules \
          --volume accountable-devcontainer-ui-node-modules:/workspaces/accountable/packages/ui/node_modules \
          accountable-devcontainer:local \
          chown devcontainer:"$(id -g)" \
            /workspaces/accountable/node_modules \
            /workspaces/accountable/apps/admin/node_modules \
            /workspaces/accountable/apps/web/node_modules \
            /workspaces/accountable/packages/proto/node_modules \
            /workspaces/accountable/packages/ui/node_modules
      - |
        if socket_group="$(stat --format='%g' /var/run/docker.sock 2>/dev/null)"; then
          :
        else
          socket_group="$(stat -f '%g' /var/run/docker.sock)"
        fi
        if [ "$(uname -s)" = "Darwin" ]; then
          socket_group=0
        fi
        docker run --rm \
          --group-add "$socket_group" \
          --volume "{{.TASKFILE_DIR}}:/workspaces/accountable" \
          --volume /var/run/docker.sock:/var/run/docker.sock \
          --volume accountable-devcontainer-home:/home/devcontainer \
          --volume accountable-devcontainer-node-modules:/workspaces/accountable/node_modules \
          --volume accountable-devcontainer-admin-node-modules:/workspaces/accountable/apps/admin/node_modules \
          --volume accountable-devcontainer-web-node-modules:/workspaces/accountable/apps/web/node_modules \
          --volume accountable-devcontainer-proto-node-modules:/workspaces/accountable/packages/proto/node_modules \
          --volume accountable-devcontainer-ui-node-modules:/workspaces/accountable/packages/ui/node_modules \
          --workdir /workspaces/accountable \
          --env CI=1 \
          accountable-devcontainer:local bash .devcontainer/parity.sh
