  "@vitejs/plugin-react": ^6.1.1
  react: ^19.3.0
  react-dom: ^19.3.0
  react-intl: ^10.2.2
  tailwindcss: ^4.3.3
  "@testing-library/react": ^16.3.3
  happy-dom: ^20.14.5
  typescript: 7.0.2
  vite: ^8.3.0
  vitest: ^4.1.11

