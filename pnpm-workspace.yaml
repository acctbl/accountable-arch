  "@phosphor-icons/react": ^2.1.10
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.29
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.0.5
  react: ^19.2.0
  react-dom: ^19.2.0
  react-intl: ^10.1.22
  tailwindcss: ^4.3.3
  "@testing-library/react": ^16.3.2
  happy-dom: ^20.11.2
  typescript: 7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10

overrides:
